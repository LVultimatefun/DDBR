<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-label="Causal VLM DAG StageCache Isolation and Splice Guardrails">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#334155" fill-opacity="0.38"/>
    </pattern>
    <pattern id="hatchViolet" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#4c1d95"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c084fc" stroke-width="2.8"/>
    </pattern>
    <marker id="arrLight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="560" rx="20" fill="url(#bg2)"/>
  <rect x="0" y="0" width="1280" height="560" rx="20" fill="url(#grid2)"/>
  <rect x="1" y="1" width="1278" height="558" rx="19" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- ==================== TOP PANEL: CAUSAL DAG & CACHE ISOLATION ==================== -->
  <text x="36" y="42" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800">Causal VLM DAG &amp; Content-Addressed StageCache Isolation</text>
  <text x="36" y="64" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Iterating S3/S4 prompts, visual taxonomy, or Few-Shot mistake book reuses S1, S2, and S5 cache 100%</text>

  <!-- Cached Upstream Zone -->
  <rect x="36" y="82" width="548" height="178" rx="14" fill="#062922" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="52" y="71" width="290" height="22" rx="11" fill="#065f46" stroke="#34d399" stroke-opacity="0.7"/>
  <text x="197" y="85.5" text-anchor="middle" fill="#d1fae5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">100% CACHE-REUSED ZONE (SHA256 ISOLATED)</text>

  <!-- S1 Node -->
  <rect x="56" y="128" width="196" height="86" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="70" y="150" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">Stage 1 · Grounding</text>
  <text x="70" y="170" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">HD 2D Object Tracking</text>
  <text x="70" y="187" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Normalized [0..1000] bbox</text>
  <text x="70" y="203" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">+ static median stabilization</text>

  <!-- Split S1 -> S2 & S5 -->
  <path d="M 252 171 L 284 171 L 284 136 L 312 136" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)"/>
  <path d="M 284 171 L 284 212 L 312 212" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald)"/>

  <!-- S2 Node -->
  <rect x="320" y="102" width="244" height="68" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="124" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">Stage 2 · Macro Backbone</text>
  <text x="334" y="143" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Contiguous macro stages</text>
  <text x="334" y="159" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">+ gapless L/R arm timelines</text>

  <!-- S5 Node -->
  <rect x="320" y="178" width="244" height="68" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="200" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700">Stage 5 · End-State (∥ S2)</text>
  <text x="334" y="219" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Dense-tail criteria checklist</text>
  <text x="334" y="235" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">+ 30% early anti-FP control</text>

  <!-- Arrow S2 -> S3 -->
  <line x1="564" y1="136" x2="626" y2="136" stroke="#94a3b8" stroke-width="2.2" marker-end="url(#arrLight)"/>

  <!-- Fast Iteration Zone -->
  <rect x="614" y="82" width="630" height="178" rx="14" fill="#1e1b4b" fill-opacity="0.52" stroke="#818cf8" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="630" y="71" width="338" height="22" rx="11" fill="#3730a3" stroke="#a5b4fc" stroke-opacity="0.7"/>
  <text x="799" y="85.5" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">FAST IN-CONTEXT ITERATION ZONE (VLM LAB)</text>

  <!-- S3 Node -->
  <rect x="634" y="110" width="188" height="130" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="646" y="132" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Stage 3 · Discover</text>
  <text x="646" y="152" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">16s sliding windows</text>
  <text x="646" y="169" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Precision-First prompts</text>
  <text x="646" y="186" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">S2 backbone protection</text>
  <rect x="646" y="198" width="164" height="28" rx="6" fill="#312e81"/>
  <text x="728" y="216" text-anchor="middle" fill="#e0e7ff" font-family="ui-monospace, monospace" font-size="10" font-weight="700">+ 2×2 Visual Few-Shots</text>

  <line x1="822" y1="175" x2="848" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrLight)"/>

  <!-- S4A Node -->
  <rect x="856" y="110" width="164" height="130" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="868" y="132" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Stage 4A · Merge</text>
  <text x="868" y="154" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Cross-window dedup</text>
  <text x="868" y="172" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Preserves distinct</text>
  <text x="868" y="188" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">consecutive retries</text>
  <text x="868" y="214" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">Deterministic fallback</text>

  <line x1="1020" y1="175" x2="1046" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrLight)"/>

  <!-- S4B Node -->
  <rect x="1054" y="110" width="172" height="130" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1066" y="132" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Stage 4B · Verify</text>
  <text x="1066" y="154" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">0.5s dense boundary</text>
  <text x="1066" y="172" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Start-vs-End 4-factor</text>
  <text x="1066" y="188" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Chain-of-Verification</text>
  <text x="1066" y="214" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">Rejects false positives</text>

  <!-- ==================== BOTTOM PANEL: 3-POLICY GUARDRAIL FUNNEL ==================== -->
  <line x1="36" y1="286" x2="1244" y2="286" stroke="#1e293b" stroke-width="1.5"/>
  <text x="36" y="318" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800">Three-Policy Splice Guardrail Funnel (Zero 30Hz Rule Detectors)</text>
  <text x="36" y="340" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Guardrails never invent labels — they protect kinematic &amp; visual continuity before any frame is spliced</text>

  <!-- Lane 1: keep_positive -->
  <g transform="translate(36, 360)">
    <rect x="0" y="0" width="230" height="52" rx="10" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="23" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="13" font-weight="700">keep_positive</text>
    <text x="16" y="40" fill="#d1fae5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">precision_fine_adjust · assist_hold</text>

    <line x1="230" y1="26" x2="870" y2="26" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrEmerald)"/>
    <rect x="440" y="13" width="236" height="24" rx="12" fill="#062922" stroke="#10b981" stroke-opacity="0.6"/>
    <text x="558" y="29" text-anchor="middle" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600">Protected backbone positive skill</text>

    <rect x="878" y="0" width="330" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="894" y="22" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12" font-weight="700">EXPORT: KEEP FULL SUPERVISION</text>
    <text x="894" y="40" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">frames kept · action_loss_mask = 1.0</text>
  </g>

  <!-- Lane 2: cut_clean -->
  <g transform="translate(36, 424)">
    <rect x="0" y="0" width="230" height="52" rx="10" fill="#78350f" fill-opacity="0.55" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="23" fill="#fde68a" font-family="ui-monospace, monospace" font-size="13" font-weight="700">cut_clean</text>
    <text x="16" y="40" fill="#fef3c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">boundary_idle · mid_idle_freeze</text>

    <line x1="230" y1="26" x2="278" y2="26" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrAmber)"/>

    <!-- Guardrail Gate Box -->
    <rect x="286" y="-4" width="496" height="60" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="302" y="16" fill="#fcd34d" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">splice_gate (kinematics)  +  visual_gate (video-only)</text>
    <text x="302" y="34" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="10.5">Δpos≤2cm · Δrot≤0.10rad · Δhand≤0.30rad · Δother≤3cm | SSIM≥0.85</text>
    <text x="302" y="49" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">Searches ±1.0s around [t_start, t_end] for minimal-jump closed-loop cut pair</text>

    <!-- PASS path -->
    <line x1="782" y1="26" x2="870" y2="26" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrAmber)"/>
    <text x="826" y="19" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PASS</text>

    <rect x="878" y="0" width="330" height="52" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="894" y="22" fill="#fde68a" font-family="ui-monospace, monospace" font-size="12" font-weight="700">EXPORT: CLEAN SPLICE REMOVE</text>
    <text x="894" y="40" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">cut out + SO(3) smoothstep tail</text>

    <!-- FAIL auto-downgrade path to mask_loss -->
    <path d="M 718 56 L 718 90 L 870 90" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrViolet)"/>
    <rect x="650" y="67" width="196" height="20" rx="10" fill="#3b0764" stroke="#c084fc" stroke-opacity="0.7"/>
    <text x="748" y="80.5" text-anchor="middle" fill="#f3e8ff" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">FAIL → AUTO-DOWNGRADE</text>
  </g>

  <!-- Lane 3: mask_loss -->
  <g transform="translate(36, 488)">
    <rect x="0" y="0" width="230" height="52" rx="10" fill="url(#hatchViolet)" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="10" y="6" width="210" height="40" rx="6" fill="#0f172a" fill-opacity="0.78"/>
    <text x="18" y="24" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700">mask_loss</text>
    <text x="18" y="40" fill="#d8b4fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">retry · slip · redo · collision</text>

    <line x1="230" y1="26" x2="640" y2="26" stroke="#c084fc" stroke-width="2.2"/>
    <line x1="640" y1="26" x2="870" y2="26" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrViolet)"/>

    <rect x="878" y="0" width="330" height="52" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="894" y="22" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="12" font-weight="700">EXPORT: KEEP FRAMES, MASK LOSS</text>
    <text x="894" y="40" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">affected arm(s) mask=0.0 (recovery opt)</text>
  </g>
</svg>
