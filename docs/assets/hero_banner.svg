  <rect x="0" y="0" width="1280" height="340" rx="20" fill="url(#glowLeft)"/>
  <rect x="0" y="0" width="1280" height="340" rx="20" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1278" height="338" rx="19" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Left Content Column -->
  <!-- Eyebrow Pill -->
