  <text x="52" y="130" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">DDBR</text>
  <text x="228" y="128" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="300">/</text>
