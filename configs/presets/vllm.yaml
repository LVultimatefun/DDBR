# Preset: Local vLLM OpenAI-compatible server (Qwen2.5-VL)
# Copy to <workspace>/configs_override/default.yaml to activate.
vlm:
  provider: "openai_compat"
  base_url: "http://127.0.0.1:8001/v1"
  api_key_env: "VLLM_API_KEY"
  key_file: ".env"
  thinking_mode: "disabled"
  concurrency: 8
  stage_models:
    s1_grounding: "Qwen/Qwen2.5-VL-72B-Instruct"
    s2_macro: "Qwen/Qwen2.5-VL-72B-Instruct"
    s3_discover: "Qwen/Qwen2.5-VL-72B-Instruct"
    s4_verify: "Qwen/Qwen2.5-VL-72B-Instruct"
    s5_success: "Qwen/Qwen2.5-VL-72B-Instruct"
  s1_grounding:
    thinking: false
  s2_macro:
    thinking: false
  s3_discover:
    thinking: false
  s4_verify:
    thinking: false
  s5_success:
    thinking: false
