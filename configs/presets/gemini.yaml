# Preset: Google Gemini (gemini-2.5-pro)
# Copy to <workspace>/configs_override/default.yaml to activate.
vlm:
  provider: "gemini"
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  api_key_env: "GEMINI_API_KEY"
  key_file: ".env"
  thinking_mode: "auto"
  stage_models:
    s1_grounding: "gemini-2.5-pro"
    s2_macro: "gemini-2.5-pro"
    s3_discover: "gemini-2.5-pro"
    s4_verify: "gemini-2.5-pro"
    s5_success: "gemini-2.5-pro"
  s1_grounding:
    thinking: true
  s2_macro:
    thinking: true
  s3_discover:
    thinking: true
  s4_verify:
    thinking: true
  s5_success:
    thinking: true
