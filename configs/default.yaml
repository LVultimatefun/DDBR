schema_version: "1.0"

vlm:
  provider: "openai_compat"          # openai_compat | gemini
  base_url: "https://api.openai.com/v1"
  api_key_env: "OPENAI_API_KEY"
  key_file: ".env"                   # searched in workspace -> cwd -> repo_root
  thinking_mode: "auto"              # auto | dashscope | disabled
  timeout_s: 180.0
  retries: 3
  retry_min_wait_s: 1.0
  retry_max_wait_s: 16.0
  concurrency: 32                    # global parallel VLM API requests
  episode_concurrency: 4
  decode_concurrency: 6
  input_mode: "interleaved"
  gemini_media_resolution: "MEDIA_RESOLUTION_HIGH"
  vision_min_tokens_per_image: 550
  vision_blind_node_retries: 5
  vision_blind_node_guard: "auto"
  vision_blind_node_on_exhaust: "raise"
  fallback_model: null
  fallback_provider: null
  circuit_breaker:
    enabled: true
    failure_threshold: 3
    trip_on_quota_403: true
  pricing:
    default:
      input_per_1m_usd: 2.50
      output_per_1m_usd: 10.0
    gpt-4o:
      input_per_1m_usd: 2.50
      output_per_1m_usd: 10.0
    gpt-4o-mini:
      input_per_1m_usd: 0.15
      output_per_1m_usd: 0.60
    gemini-2.5-pro:
      input_per_1m_usd: 1.25
      output_per_1m_usd: 10.0
    gemini-2.5-flash:
      input_per_1m_usd: 0.30
      output_per_1m_usd: 2.50
    qwen-vl-max:
      input_per_1m_usd: 0.80
      output_per_1m_usd: 3.20

  # Stage-level heterogeneous model routing
  stage_models:
    s1_grounding: "gpt-4o"
    s2_macro: "gpt-4o"
    s3_discover: "gpt-4o"
    s4_verify: "gpt-4o"
    s5_success: "gpt-4o"

  # Dynamic duration token budget
  budget:
    tokens_per_second: 5000          # ceil(duration_s * 5000)
    min_episode_tokens: 200000
    max_tokens_per_episode: null     # null = dynamic scaling without fixed cap; int = hard cap
    unlimited: false

  s1_grounding:
    enabled: true
    batch_size: 4
    batch_concurrency: 3
    reference_anchor_enabled: true
    pass0_image_detail: "low"
    image_detail: "high"
    merge_pass0_short_episode: true
    interval_s: 2.5
    max_keyframes: 32
    hard_max_keyframes: 72
    ego_height: 540
    jpeg_quality: 80
    ref_width: 1280
    ref_height: 720
    min_box_px: 12
    thinking: false
    thinking_budget: 768
    max_tokens: 2400
    static_container_min_frames: 5
    static_jitter_tol_px_1280: 85.0
    tracking:
      enabled: true
      track_fps: 15.0
      short_native_fps_max_s: 15.0
      track_width: 480
      flow_preset: "ultrafast"
      ncc_stride: 2
      ncc_min_score: 0.55
      fb_max_err_px: 2.5
      occlusion_conf_thresh: 0.25
      occlusion_min_frames: 4
      smooth_window: 5
      camera_motion_threshold_norm: 25.0
      outlier_jump_norm: 250.0
      moderate_outlier_jump_norm: 75.0
      anchor_scale_jitter_ratio: 0.22
      anchor_min_blend_weight: 0.15
      anchor_max_blend_weight: 0.80
      adaptive_reanchor_max_calls: 0
      adaptive_disagree_ratio: 0.65

  s2_macro:
    interval_s: 2.0
    max_frames: 48
    long_episode_threshold_s: 96.0
    long_episode_max_frames: 64
    cell_w: 320
    cell_h: 180
    quality: 70
    image_detail: "low"
    static_dedup_enabled: true
    static_dedup_mad_thresh: 4.5
    static_dedup_max_gap_s: 6.0
    thinking: false
    thinking_budget: 1536
    max_tokens: 4096

  s3_discover:
    window_s: 16.0
    window_stride_s: 12.0
    window_step_s: 0.8
    adaptive_step_enabled: true
    idle_step_s: 1.4
    cell_w: 420
    cell_h: 236
    quality: 76
    image_detail: "auto"
    static_dedup_enabled: true
    static_dedup_mad_thresh: 3.5
    static_dedup_max_gap_s: 3.2
    thinking: false
    thinking_budget: 1536
    max_tokens: 3200
    few_shot_top_k: 4
    few_shot_max_tokens: 4000

  s4_verify:
    merge_thinking_budget: 1536
    merge_max_tokens: 6144
    refine_margin_s: 1.5
    refine_step_s: 0.5
    refine_min_frames: 4
    refine_max_frames: 18
    dynamic_refine_frames: true
    cell_w: 384
    cell_h: 216
    quality: 76
    image_detail: "auto"
    thinking: false
    refine_thinking_budget: 1280
    refine_max_tokens: 1536
    boundary_idle_kin_skip_s4b: true

  s5_success:
    enabled: true
    tail_s: 12.0
    tail_ratio: 0.22
    max_tail_s: 25.0
    body_frames: 6
    tail_frames: 10
    control_ratio: 0.30
    control_frames: 8
    cell_w: 420
    cell_h: 236
    quality: 78
    image_detail: "auto"
    start_end_compare: true
    compare_panel_w: 640
    compare_panel_h: 360
    thinking: false
    thinking_budget: 1024
    max_tokens: 1536

io:
  target_fps: 30.0
  preview_cache:
    max_cache_gb: 10.0
  h5:
    hand_mapping:
      left: "hand_a"
      right: "hand_b"
    min_invalid_gap_s: 0.5           # real-timestamp gap >= this marks force valid_mask False
    camera_roles:
      main: "head_rgbd"
      front: "torso_rgbd"
      wide: "head_stereo_left"
      wide_right: "head_stereo_right"
  video_dir:
    default_fps: 30.0
    camera_roles:
      main: "main"

guardrail:
  splice_gate:
    search_margin_s: 1.0             # [t_start+-1.0s, t_end+-1.0s]
    boundary_edge_tol_s: 0.5         # boundary_idle within this of 0 or duration_s passes directly
    max_pos_jump_m: 0.02             # 2.0 cm
    max_rot_jump_rad: 0.10           # 0.10 rad
    max_hand_jump_rad: 0.30          # 0.30 rad
    max_torso_jump_rad: 0.05         # 0.05 rad
    max_chassis_pos_jump_m: 0.02     # 2.0 cm
    max_chassis_yaw_jump_rad: 0.05   # 0.05 rad
    max_other_arm_disp_m: 0.03       # 3.0 cm (bimanual coupling limit)
  hallucination:
    enabled: true
    idle_arm_disp_m: 0.15            # >15 cm monotonic motion on affected arm contradicts idle_freeze
  visual_gate:
    min_crop_ssim: 0.85
    max_l1_diff: 0.12

review:
  claim_ttl_s: 120.0
  min_watch_coverage: 0.95
  require_confirmed_success: true

export:
  robot_type: "bimanual_robot"
  mode: "pieces"
  chunk_size: null
  min_piece_s: 0.1
  tail_frames: null
  smooth_tail: "on_jump"             # on_jump | always | never
  lerobot_v3_max_file_mb: 100
