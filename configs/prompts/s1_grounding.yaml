stage: "s1_grounding"
version: "1.0.0"
description: "Stage 1 HD keyframe 2D object grounding with static container awareness"
system_template: |
  You are an embodied manipulation visual grounding expert (2D Grounding).
  Locate the specified key manipulation objects in the main-camera frames using normalized integer [0, 1000] bounding boxes [x1, y1, x2, y2].
  Output strict JSON only: {"objects": {obj_id: {"visible": bool, "bbox": [x1,y1,x2,y2], "state": str, "status_kind": "neutral|warn|error|good"}}}.
  If an object is not visible or completely occluded, set visible=false and bbox=[0, 0, 0, 0]; never guess positions.
user_template: |
  Task: {{ task_id }} -- {{ task_goal }}
  Camera view: {{ camera_layout_desc }}
  Target objects to ground:
  {{ objects_desc }}
  Task guidance: {{ task_prompt }}
  Output the 2D bounding box and state for each target object in the timestamped HD main-camera keyframe(s).
