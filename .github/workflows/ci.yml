name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Node 22 Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies, test, and build
        working-directory: web
        run: |
          npm ci
          CI=true npm test
          npm run build

      - name: Upload built Web Studio bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  python:
    name: Python 3.12 Tests & Packaging
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built Web Studio bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system video dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest tests -q

      - name: Verify non-editable wheel packaging and bundled configs
        run: |
          pip install --no-cache-dir build
          python -m build --wheel --outdir /tmp/robo_vlm_qc_dist
          python -m venv /tmp/robo_vlm_qc_wheel_venv
          /tmp/robo_vlm_qc_wheel_venv/bin/pip install --no-cache-dir /tmp/robo_vlm_qc_dist/*.whl
          cd /tmp && /tmp/robo_vlm_qc_wheel_venv/bin/python -c "
          from pathlib import Path
          from robo_vlm_qc.config import ConfigManager, default_config_dir
          cfg_dir = default_config_dir()
          assert cfg_dir.name == '_bundled_configs', f'Unexpected config dir: {cfg_dir}'
          assert (cfg_dir / 'default.yaml').is_file()
          assert (cfg_dir / 'labels.yaml').is_file()
          assert list((cfg_dir / 'prompts').glob('*.yaml'))
          assert list((cfg_dir / 'tasks').glob('*.yaml'))
          assert list((cfg_dir / 'presets').glob('*.yaml'))
          mgr = ConfigManager()
          assert len(mgr.labels.labels) == 11
          print('Wheel bundled configs OK:', cfg_dir)
          "

      - name: Smoke-test synthetic demo dataset script and ingest CLI
        run: |
          python scripts/generate_demo_dataset.py --out /tmp/ci_demo_data
          robo-vlm-qc -w /tmp/ci_demo_ws ingest --data /tmp/ci_demo_data --json
